name: Release

# Push a tag like v1.0.1 to test, build and publish a GitHub Release with the .vsix.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Build
        run: python3 scripts/build_vsix.py

      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else "See CHANGELOG.md")
          notes += "\n\n### 安装 / Install\n下载下面的 `.vsix`，在 VS Code 扩展视图 → `…` → **从 VSIX 安装…**。\n可用 `.sha256` 文件校验下载是否完整。"
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix dist/*.vsix.sha256 \
            --title "Codex Notify $GITHUB_REF_NAME" --notes-file release-notes.md
